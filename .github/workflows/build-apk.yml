name: APK жинау

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android жобасын жасау
        run: |
          mkdir -p /tmp/keep
          cp main.dart /tmp/keep/main.dart
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create . --platforms=android --project-name barber_book --org kz.barber
          rm -rf lib test
          mkdir lib
          cp /tmp/keep/main.dart lib/main.dart
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="Барбер"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: barber-apk
          path: build/app/outputs/flutter-apk/app-release.apk
